<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FORM/01 — Fashion Commerce Concept</title>
  <style>
    :root {
      --ink: #111310;
      --ink-2: #191c18;
      --paper: #f1efe8;
      --paper-2: #e5e2d9;
      --white: #fffef9;
      --acid: #c8ff39;
      --muted: #757a72;
      --line: rgba(17,19,16,.16);
      --display: Bahnschrift, "Arial Narrow", Arial, sans-serif;
      --sans: "Segoe UI", Arial, sans-serif;
      --serif: Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0f0d; }
    body { font-family: var(--sans); color: var(--ink); }
    button, input { font: inherit; }
    .shot { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
    .mono { font-family: var(--display); letter-spacing: .08em; }
    .eyebrow { font: 600 14px/1 var(--display); letter-spacing: .22em; text-transform: uppercase; }
    .btn { height: 58px; padding: 0 28px; border: 1px solid var(--ink); background: var(--ink); color: var(--white); display: inline-flex; align-items: center; justify-content: center; gap: 14px; font: 600 14px var(--display); letter-spacing: .12em; text-transform: uppercase; }
    .btn.acid { background: var(--acid); color: var(--ink); border-color: var(--acid); }
    .btn.ghost { background: transparent; color: var(--ink); }
    .rule { height: 1px; background: var(--line); }
    .topbar { height: 32px; background: var(--acid); display: flex; align-items: center; justify-content: center; font: 600 12px var(--display); letter-spacing: .16em; text-transform: uppercase; }
    .nav { height: 88px; padding: 0 64px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: rgba(241,239,232,.95); border-bottom: 1px solid var(--line); }
    .navlinks { display: flex; gap: 30px; font: 600 13px var(--display); letter-spacing: .12em; text-transform: uppercase; }
    .brand { font: 700 30px var(--display); letter-spacing: -.035em; }
    .brand b { color: #8fbf14; }
    .navicons { display: flex; justify-content: flex-end; align-items: center; gap: 24px; }
    .icon { width: 22px; height: 22px; display: inline-grid; place-items: center; }
    .icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .count { width: 20px; height: 20px; border-radius: 50%; background: var(--acid); font: 700 11px var(--display); display: inline-grid; place-items: center; margin-left: -18px; margin-top: -20px; }
    .tag { border: 1px solid currentColor; padding: 8px 12px; font: 600 11px var(--display); letter-spacing: .16em; text-transform: uppercase; }
    .lime-dot { width: 9px; height: 9px; background: var(--acid); border-radius: 50%; display: inline-block; }
    .browser { position: relative; overflow: hidden; background: var(--paper); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 44px 100px rgba(0,0,0,.28); }
    .browserbar { height: 44px; background: #e7e5de; border-bottom: 1px solid #cbc8bf; display: flex; align-items: center; gap: 8px; padding: 0 16px; }
    .browserbar i { width: 10px; height: 10px; border-radius: 50%; background: #b9b7b0; }
    .browserbar span { margin-left: 18px; width: 48%; height: 18px; border-radius: 9px; background: #d3d0c7; }
    .phone { width: 310px; height: 650px; padding: 10px; border-radius: 48px; background: #0a0b0a; box-shadow: 0 38px 90px rgba(0,0,0,.3); border: 1px solid #40433e; }
    .phone-screen { position: relative; width: 100%; height: 100%; border-radius: 39px; overflow: hidden; background: var(--paper); }
    .phone-notch { position: absolute; z-index: 9; top: 14px; left: 50%; width: 90px; height: 23px; border-radius: 14px; transform: translateX(-50%); background: #090a09; }
    .safe { padding-top: 42px; }
    .watermark { position: absolute; right: 34px; bottom: 24px; z-index: 20; color: rgba(255,255,255,.58); font: 600 11px var(--display); letter-spacing: .16em; text-transform: uppercase; }

    /* Shot 1 — cover */
    .cover { background: #0f110f; color: var(--white); }
    .cover-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .46; filter: saturate(.72) contrast(1.05); }
    .cover-scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,12,10,.98) 0%, rgba(10,12,10,.9) 38%, rgba(10,12,10,.24) 75%, rgba(10,12,10,.45)); }
    .cover-grid { position: absolute; inset: 0; opacity: .16; background-image: linear-gradient(rgba(255,255,255,.16) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.16) 1px, transparent 1px); background-size: 96px 96px; }
    .cover-copy { position: absolute; left: 110px; top: 120px; width: 690px; z-index: 3; }
    .cover-copy .brand { font-size: 38px; margin-bottom: 150px; }
    .cover-copy h1 { margin: 18px 0 24px; font: 600 108px/.86 var(--display); letter-spacing: -.065em; text-transform: uppercase; }
    .cover-copy p { width: 560px; color: rgba(255,255,255,.7); font-size: 20px; line-height: 1.55; }
    .cover-meta { position: absolute; bottom: 72px; left: 110px; z-index: 3; display: flex; gap: 46px; font: 500 12px var(--display); letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.58); }
    .cover-device { position: absolute; right: -70px; top: 120px; width: 950px; height: 720px; transform: rotate(-2.5deg); border-radius: 12px; z-index: 2; }
    .cover-device img { width: 100%; height: 100%; object-fit: cover; }
    .cover-device .mini-ui { position: absolute; inset: 44px 0 0 0; background: linear-gradient(90deg, rgba(15,17,15,.9), transparent 58%); padding: 70px; }
    .cover-device .mini-ui h2 { width: 480px; margin: 0; font: 600 70px/.92 var(--display); letter-spacing: -.05em; text-transform: uppercase; }
    .cover-device .mini-ui .btn { margin-top: 32px; }
    .cover-phone { position: absolute; right: 710px; bottom: -185px; z-index: 4; transform: rotate(7deg) scale(.78); }
    .cover-phone .phone-screen { background: #ece9e1; }
    .cover-phone img { width: 100%; height: 390px; object-fit: cover; }
    .cover-phone h3 { margin: 22px 20px 10px; font: 600 28px/.94 var(--display); letter-spacing: -.035em; text-transform: uppercase; }
    .cover-phone p { margin: 0 20px; color: var(--muted); font-size: 13px; }

    /* Shot 2 — homepage */
    .home-hero { height: 960px; position: relative; background: #121411; color: var(--white); }
    .home-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .home-hero:after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(12,14,12,.94) 0%, rgba(12,14,12,.7) 37%, rgba(12,14,12,.05) 72%); }
    .home .nav { position: absolute; z-index: 4; top: 32px; left: 0; right: 0; background: rgba(15,17,15,.58); color: white; border-color: rgba(255,255,255,.2); backdrop-filter: blur(14px); }
    .home-copy { position: absolute; z-index: 3; left: 96px; top: 245px; width: 780px; }
    .home-copy h1 { margin: 24px 0 30px; font: 600 112px/.84 var(--display); letter-spacing: -.07em; text-transform: uppercase; }
    .home-copy p { width: 510px; color: rgba(255,255,255,.76); font-size: 19px; line-height: 1.55; }
    .home-actions { display: flex; gap: 14px; margin-top: 34px; }
    .home-card { position: absolute; z-index: 3; right: 66px; bottom: 62px; width: 350px; padding: 22px; background: rgba(241,239,232,.9); color: var(--ink); backdrop-filter: blur(20px); }
    .home-card-top { display: flex; align-items: center; justify-content: space-between; }
    .home-card h3 { margin: 18px 0 8px; font: 600 28px/1 var(--display); letter-spacing: -.035em; text-transform: uppercase; }
    .home-card p { color: #555b53; font-size: 13px; line-height: 1.5; margin-bottom: 22px; }
    .scroll-mark { position: absolute; z-index: 3; left: 96px; bottom: 52px; display: flex; align-items: center; gap: 12px; font: 600 11px var(--display); letter-spacing: .18em; text-transform: uppercase; }
    .scroll-mark:before { content: ""; width: 54px; height: 1px; background: var(--acid); }

    /* Shot 3 — editorial collection */
    .editorial { background: var(--paper); }
    .editorial-grid { height: 960px; display: grid; grid-template-columns: 1.12fr .88fr; }
    .editorial-media { position: relative; overflow: hidden; }
    .editorial-media img { width: 100%; height: 100%; object-fit: cover; }
    .vertical-label { position: absolute; left: 26px; top: 50%; transform: translateY(-50%) rotate(-90deg); transform-origin: center; font: 600 12px var(--display); letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.74); }
    .editorial-copy { padding: 110px 90px 70px; display: flex; flex-direction: column; }
    .editorial-copy h1 { margin: 30px 0 20px; font: 600 78px/.92 var(--display); letter-spacing: -.055em; text-transform: uppercase; }
    .editorial-copy .lead { font: italic 30px/1.38 var(--serif); color: #41463f; max-width: 620px; }
    .feature-list { margin-top: auto; border-top: 1px solid var(--line); }
    .feature-row { height: 74px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 70px 1fr auto; align-items: center; }
    .feature-row b { font: 600 13px var(--display); letter-spacing: .12em; }
    .feature-row span { color: var(--muted); font-size: 14px; }
    .feature-row em { width: 28px; height: 28px; border: 1px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font-style: normal; }

    /* Shot 4 — shop */
    .shop-body { height: 960px; padding: 58px 64px 46px; }
    .shop-head { display: flex; justify-content: space-between; align-items: end; margin-bottom: 34px; }
    .shop-head h1 { margin: 0; font: 600 64px/.9 var(--display); letter-spacing: -.05em; text-transform: uppercase; }
    .shop-head small { font: 600 12px var(--display); letter-spacing: .15em; color: var(--muted); text-transform: uppercase; }
    .shop-layout { display: grid; grid-template-columns: 230px 1fr; gap: 38px; }
    .filters { border-top: 1px solid var(--ink); }
    .filter { height: 64px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; font: 600 12px var(--display); letter-spacing: .1em; text-transform: uppercase; }
    .filter span:last-child { font-size: 20px; font-weight: 400; }
    .products { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .product { position: relative; }
    .product-img { height: 470px; background: #e3e1d9; overflow: hidden; position: relative; }
    .product-img img { width: 100%; height: 100%; object-fit: cover; }
    .product-img.catalog img { object-fit: contain; mix-blend-mode: multiply; padding: 22px; }
    .product-img.alt { background: #d6d9d4; }
    .product-img.dark { background: #252824; }
    .product-img.dark img { filter: invert(.86) grayscale(1); mix-blend-mode: screen; }
    .pill { position: absolute; left: 12px; top: 12px; background: var(--acid); padding: 7px 10px; font: 700 10px var(--display); letter-spacing: .12em; text-transform: uppercase; }
    .heart { position: absolute; right: 14px; top: 14px; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.86); display: grid; place-items: center; font-size: 19px; }
    .product-info { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 14px 2px; }
    .product-info h3 { margin: 0; font: 600 14px var(--display); letter-spacing: .05em; text-transform: uppercase; }
    .product-info p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .product-info b { font: 600 13px var(--display); }

    /* Shot 5 — product detail */
    .pdp { height: 960px; display: grid; grid-template-columns: 1.12fr .88fr; }
    .pdp-gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #d0cec6; }
    .pdp-gallery figure { margin: 0; background: #e7e4dc; display: grid; place-items: center; overflow: hidden; }
    .pdp-gallery figure:nth-child(2) { background: #d9dcd7; }
    .pdp-gallery img { width: 95%; height: 95%; object-fit: contain; mix-blend-mode: multiply; }
    .pdp-gallery figure:nth-child(2) img { transform: scale(1.35); transform-origin: 54% 38%; }
    .pdp-info { padding: 54px 76px; display: flex; flex-direction: column; background: var(--white); }
    .crumb { color: var(--muted); font: 600 11px var(--display); letter-spacing: .14em; text-transform: uppercase; }
    .pdp-title { display: flex; justify-content: space-between; margin-top: 68px; }
    .pdp-title h1 { margin: 0; font: 600 54px/.94 var(--display); letter-spacing: -.05em; text-transform: uppercase; }
    .pdp-title b { font: 600 18px var(--display); }
    .pdp-desc { margin: 24px 0 30px; max-width: 520px; color: #555b53; font-size: 15px; line-height: 1.65; }
    .option-label { display: flex; justify-content: space-between; margin-top: 16px; font: 600 12px var(--display); letter-spacing: .1em; text-transform: uppercase; }
    .sizes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; }
    .size { height: 48px; border: 1px solid var(--line); display: grid; place-items: center; font: 600 12px var(--display); }
    .size.active { border-color: var(--ink); background: var(--ink); color: white; }
    .swatches { display: flex; gap: 12px; margin: 14px 0 26px; }
    .swatch { width: 31px; height: 31px; border-radius: 50%; background: #151715; border: 6px solid white; outline: 1px solid #111; }
    .swatch.grey { background: #7d817b; outline: none; }
    .pdp-note { margin-top: 18px; background: #eefbd0; border-left: 3px solid #8eb80d; padding: 15px 18px; display: flex; gap: 12px; align-items: center; font-size: 13px; color: #3e4438; }
    .accordion { margin-top: auto; border-top: 1px solid var(--line); }
    .accordion div { height: 54px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font: 600 11px var(--display); letter-spacing: .1em; text-transform: uppercase; }

    /* Shot 6 — cart drawer */
    .cart-bg { position: absolute; inset: 0; filter: brightness(.36); }
    .cart-bg img { width: 100%; height: 100%; object-fit: cover; }
    .cart-drawer { position: absolute; right: 0; top: 0; bottom: 0; width: 650px; background: var(--white); padding: 52px; box-shadow: -30px 0 80px rgba(0,0,0,.28); }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; }
    .drawer-head h1 { margin: 0; font: 600 42px var(--display); letter-spacing: -.04em; text-transform: uppercase; }
    .drawer-head span { font-size: 30px; font-weight: 300; }
    .shipping-msg { margin: 34px 0 28px; font-size: 13px; }
    .progress { height: 5px; background: #d9d8d1; margin-top: 10px; }
    .progress i { display: block; width: 78%; height: 100%; background: var(--acid); }
    .cart-item { display: grid; grid-template-columns: 155px 1fr; gap: 24px; padding: 24px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .cart-thumb { height: 190px; background: #e5e2da; }
    .cart-thumb img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
    .cart-item h3 { margin: 6px 0 9px; font: 600 18px var(--display); text-transform: uppercase; }
    .cart-item p { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
    .qty { display: inline-flex; height: 38px; border: 1px solid var(--line); align-items: center; gap: 20px; padding: 0 14px; font-size: 13px; }
    .cart-price { float: right; font: 600 14px var(--display); }
    .cross-sell { margin-top: 34px; }
    .cross-sell h4 { font: 600 12px var(--display); letter-spacing: .12em; text-transform: uppercase; }
    .cross-card { display: grid; grid-template-columns: 90px 1fr auto; gap: 16px; align-items: center; background: var(--paper); padding: 12px; }
    .cross-card img { width: 90px; height: 92px; object-fit: contain; mix-blend-mode: multiply; }
    .cross-card b { font: 600 13px var(--display); text-transform: uppercase; }
    .cross-card small { color: var(--muted); }
    .totals { position: absolute; left: 52px; right: 52px; bottom: 44px; }
    .total-row { display: flex; justify-content: space-between; margin-bottom: 17px; font: 600 14px var(--display); }
    .totals .btn { width: 100%; }

    /* Shot 7 — checkout */
    .checkout { background: #f7f5ef; }
    .checkout-head { height: 110px; padding: 0 80px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .steps { display: flex; gap: 42px; font: 600 12px var(--display); letter-spacing: .1em; text-transform: uppercase; }
    .steps span { color: #a0a39c; }
    .steps .active { color: var(--ink); }
    .checkout-body { display: grid; grid-template-columns: 1fr 720px; min-height: 970px; }
    .form-side { padding: 54px 120px 50px 160px; }
    .form-side h1 { margin: 0 0 34px; font: 600 52px var(--display); letter-spacing: -.04em; text-transform: uppercase; }
    .express { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .express button { height: 52px; background: #111; color: white; border: 0; font: 700 13px var(--display); letter-spacing: .08em; }
    .or { display: flex; align-items: center; gap: 16px; margin: 24px 0; color: var(--muted); font: 600 11px var(--display); letter-spacing: .14em; }
    .or:before, .or:after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { height: 58px; border: 1px solid #c9c7bf; padding: 9px 15px; display: flex; flex-direction: column; justify-content: center; background: white; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; }
    .field span { font-size: 14px; margin-top: 4px; }
    .delivery { margin-top: 28px; }
    .delivery h3 { font: 600 13px var(--display); letter-spacing: .12em; text-transform: uppercase; }
    .delivery-option { height: 70px; border: 1px solid var(--ink); display: flex; align-items: center; justify-content: space-between; padding: 0 18px; background: white; }
    .delivery-option b { font: 600 13px var(--display); }
    .delivery-option small { color: var(--muted); display: block; margin-top: 4px; }
    .summary-side { background: #e8e6df; padding: 70px 80px; border-left: 1px solid var(--line); }
    .summary-side h2 { margin: 0 0 36px; font: 600 28px var(--display); text-transform: uppercase; }
    .summary-product { display: grid; grid-template-columns: 110px 1fr auto; gap: 18px; align-items: center; }
    .summary-product figure { margin: 0; height: 130px; background: #f7f5ef; }
    .summary-product img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
    .summary-product h3 { font: 600 14px var(--display); text-transform: uppercase; margin: 0 0 6px; }
    .summary-product p { margin: 0; font-size: 12px; color: var(--muted); }
    .summary-lines { margin-top: 34px; padding-top: 26px; border-top: 1px solid var(--line); }
    .summary-lines div { display: flex; justify-content: space-between; margin-bottom: 18px; font-size: 14px; }
    .summary-lines .grand { padding-top: 22px; border-top: 1px solid var(--line); font: 600 21px var(--display); }
    .trust { margin-top: 34px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .trust div { padding: 16px; border: 1px solid rgba(17,19,16,.14); font-size: 12px; line-height: 1.4; }
    .trust b { display: block; font: 600 11px var(--display); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }

    /* Shot 8 — mobile home */
    .mobile-board { background: #171a16; color: white; }
    .mobile-board:before { content: ""; position: absolute; inset: 0; opacity: .13; background-image: linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px); background-size: 80px 80px; }
    .mobile-copy { position: absolute; left: 110px; top: 125px; width: 560px; }
    .mobile-copy h1 { margin: 24px 0; font: 600 86px/.88 var(--display); letter-spacing: -.06em; text-transform: uppercase; }
    .mobile-copy p { color: rgba(255,255,255,.64); font-size: 18px; line-height: 1.6; }
    .mobile-copy .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 32px; }
    .mobile-copy .tag { color: rgba(255,255,255,.72); }
    .phone-a { position: absolute; left: 880px; top: 76px; transform: rotate(-4deg); }
    .phone-b { position: absolute; left: 1240px; top: 190px; transform: rotate(5deg); }
    .mobile-nav { height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: rgba(241,239,232,.94); color: var(--ink); }
    .mobile-nav .brand { font-size: 18px; }
    .mobile-hero { height: 355px; position: relative; color: white; }
    .mobile-hero img { width: 100%; height: 100%; object-fit: cover; object-position: 60% center; }
    .mobile-hero:after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, rgba(0,0,0,.78)); }
    .mobile-hero div { position: absolute; z-index: 2; left: 20px; right: 20px; bottom: 22px; }
    .mobile-hero h3 { margin: 8px 0 12px; font: 600 30px/.92 var(--display); letter-spacing: -.04em; text-transform: uppercase; }
    .mobile-hero .btn { height: 42px; padding: 0 18px; font-size: 10px; }
    .mobile-strip { padding: 18px 18px 0; }
    .mobile-strip h4 { margin: 0 0 12px; font: 600 12px var(--display); letter-spacing: .12em; text-transform: uppercase; }
    .mobile-products { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .mobile-products div { height: 150px; background: #dedbd3; overflow: hidden; }
    .mobile-products img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
    .rtl { direction: rtl; font-family: "Segoe UI", Arial, sans-serif; }
    .rtl .mobile-hero div { left: 18px; right: 18px; text-align: right; }
    .rtl .mobile-hero h3 { font-family: "Segoe UI", Arial, sans-serif; font-weight: 700; line-height: 1.18; }

    /* Shot 9 — mobile discovery and filters */
    .filter-board { background: var(--paper); }
    .filter-copy { position: absolute; left: 120px; top: 135px; width: 610px; }
    .filter-copy h1 { margin: 24px 0; font: 600 92px/.9 var(--display); letter-spacing: -.065em; text-transform: uppercase; }
    .filter-copy p { color: #5f655d; font-size: 18px; line-height: 1.6; max-width: 540px; }
    .ux-points { margin-top: 50px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .ux-point { border-top: 1px solid var(--ink); padding-top: 14px; }
    .ux-point b { font: 600 12px var(--display); letter-spacing: .12em; text-transform: uppercase; }
    .ux-point span { display: block; margin-top: 8px; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .filter-phone-a { position: absolute; left: 950px; top: 100px; }
    .filter-phone-b { position: absolute; left: 1310px; top: 210px; }
    .mobile-shop-head { padding: 68px 18px 15px; display: flex; justify-content: space-between; align-items: flex-end; }
    .mobile-shop-head h3 { margin: 0; font: 600 28px var(--display); text-transform: uppercase; }
    .mobile-shop-head span { font-size: 11px; color: var(--muted); }
    .mobile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 12px; }
    .mobile-card { height: 250px; background: #dedbd3; }
    .mobile-card img { width: 100%; height: 78%; object-fit: contain; mix-blend-mode: multiply; }
    .mobile-card b { display: block; padding: 5px 8px 0; font: 600 10px var(--display); text-transform: uppercase; }
    .bottom-sheet { position: absolute; inset: auto 0 0; height: 465px; background: var(--white); border-radius: 28px 28px 0 0; box-shadow: 0 -24px 50px rgba(0,0,0,.16); padding: 18px 20px; }
    .sheet-handle { width: 44px; height: 4px; border-radius: 3px; background: #cbc9c0; margin: 0 auto 22px; }
    .bottom-sheet h3 { margin: 0 0 20px; font: 700 23px "Segoe UI"; }
    .sheet-row { height: 54px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .sheet-row b { font-size: 19px; }
    .sheet-actions { position: absolute; bottom: 20px; left: 20px; right: 20px; display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
    .sheet-actions .btn { height: 48px; font-size: 10px; padding: 0 10px; }

    /* Shot 10 — tracking and system */
    .track { background: #f4f2ec; }
    .track-body { height: 960px; display: grid; grid-template-columns: 330px 1fr; }
    .account-nav { background: #171a16; color: white; padding: 60px 42px; }
    .account-nav h2 { margin: 40px 0 54px; font: 600 35px var(--display); letter-spacing: -.04em; text-transform: uppercase; }
    .account-link { height: 54px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,.14); color: rgba(255,255,255,.64); font: 600 12px var(--display); letter-spacing: .1em; text-transform: uppercase; }
    .account-link.active { color: var(--acid); }
    .track-main { padding: 68px 80px; }
    .track-head { display: flex; align-items: flex-end; justify-content: space-between; }
    .track-head h1 { margin: 0; font: 600 58px var(--display); letter-spacing: -.05em; text-transform: uppercase; }
    .track-head p { margin: 8px 0 0; color: var(--muted); }
    .status-chip { background: #e7f7bd; padding: 12px 18px; font: 700 11px var(--display); letter-spacing: .12em; text-transform: uppercase; }
    .tracking-card { margin-top: 54px; background: white; padding: 38px; border: 1px solid var(--line); }
    .track-meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; }
    .track-meta small { color: var(--muted); font: 600 10px var(--display); letter-spacing: .12em; text-transform: uppercase; }
    .track-meta b { display: block; margin-top: 8px; font: 600 14px var(--display); }
    .timeline { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); margin: 58px 0 42px; }
    .timeline:before { content: ""; position: absolute; top: 13px; left: 12%; right: 12%; height: 2px; background: #d8d7d0; }
    .timeline:after { content: ""; position: absolute; top: 13px; left: 12%; width: 50%; height: 2px; background: #20231f; }
    .step { position: relative; z-index: 2; text-align: center; }
    .step i { width: 28px; height: 28px; display: grid; place-items: center; margin: 0 auto 14px; border-radius: 50%; background: #d8d7d0; border: 5px solid white; outline: 1px solid #d8d7d0; font-style: normal; font-size: 10px; }
    .step.done i { background: var(--ink); color: var(--acid); outline-color: var(--ink); }
    .step.active i { background: var(--acid); color: var(--ink); outline-color: #8fb20f; }
    .step b { font: 600 11px var(--display); letter-spacing: .08em; text-transform: uppercase; }
    .step small { display: block; margin-top: 7px; color: var(--muted); }
    .order-card { display: grid; grid-template-columns: 95px 1fr auto; gap: 18px; align-items: center; padding-top: 28px; border-top: 1px solid var(--line); }
    .order-card figure { margin: 0; width: 95px; height: 105px; background: #efede7; }
    .order-card img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
    .order-card h3 { margin: 0 0 7px; font: 600 14px var(--display); text-transform: uppercase; }
    .order-card p { margin: 0; color: var(--muted); font-size: 12px; }
    .system-band { position: absolute; right: 58px; bottom: 48px; display: flex; gap: 10px; align-items: center; color: var(--muted); font: 600 10px var(--display); letter-spacing: .12em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main id="root"></main>
  <script>
    const A = 'assets/';
    const icons = {
      search: '<span class="icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span>',
      user: '<span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></span>',
      bag: '<span class="icon"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg></span>',
      menu: '<span class="icon"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span>'
    };
    const nav = (dark=false) => `<div class="topbar">Free delivery on orders over EGP 2,500</div><nav class="nav ${dark?'nav-dark':''}"><div class="navlinks"><span>Shop</span><span>Collections</span><span>Field notes</span><span>Track order</span></div><div class="brand">FORM<b>/</b>01</div><div class="navicons"><span class="mono" style="font-size:12px">AR</span>${icons.search}${icons.user}${icons.bag}<span class="count">1</span></div></nav>`;
    const watermark = '<div class="watermark">YANSY TECH · UI/UX CONCEPT · 2026</div>';
    const browserBar = '<div class="browserbar"><i></i><i></i><i></i><span></span></div>';

    function productCard(img, name, type, price, cls='', badge='') {
      return `<article class="product"><div class="product-img catalog ${cls}">${badge?`<span class="pill">${badge}</span>`:''}<span class="heart">♡</span><img src="${A+img}" alt="" /></div><div class="product-info"><div><h3>${name}</h3><p>${type}</p></div><b>EGP ${price}</b></div></article>`;
    }

    const shots = {
      1: () => `<section class="shot cover"><img class="cover-bg" src="${A}campaign-hero.png" alt=""/><div class="cover-scrim"></div><div class="cover-grid"></div><div class="cover-copy"><div class="brand">FORM<b>/</b>01</div><span class="eyebrow" style="color:var(--acid)">Fashion commerce experience</span><h1>Utility<br>meets<br>clarity.</h1><p>A conversion-led digital flagship for a fictional Egyptian apparel label. Designed as a complete responsive shopping system.</p></div><div class="browser cover-device">${browserBar}<img src="${A}campaign-duo.png" alt=""/><div class="mini-ui"><span class="eyebrow">Drop 04 · Transit</span><h2>Built to move differently.</h2><button class="btn acid">Explore the drop →</button></div></div><div class="phone cover-phone"><div class="phone-screen"><div class="phone-notch"></div><img src="${A}product-overshirt.png" alt=""/><h3>Modular overshirt 01</h3><p>EGP 2,450 · Black</p></div></div><div class="cover-meta"><span>Strategy</span><span>UX / UI</span><span>Responsive commerce</span><span>2026</span></div>${watermark}</section>`,

      2: () => `<section class="shot home"><div class="home-hero"><img src="${A}campaign-hero.png" alt=""/>${nav(true)}<div class="home-copy"><span class="eyebrow" style="color:var(--acid)">Drop 04 · Transit systems</span><h1>Everyday<br>motion.<br>Rebuilt.</h1><p>Modular essentials engineered for movement. Precise fits. Considered materials. Designed in Cairo.</p><div class="home-actions"><button class="btn acid">Shop the drop →</button><button class="btn" style="background:rgba(0,0,0,.15);border-color:rgba(255,255,255,.55)">View lookbook</button></div></div><div class="home-card"><div class="home-card-top"><span class="eyebrow">Featured system</span><span>01 / 04</span></div><h3>Modular Overshirt</h3><p>Two textures. Four-season weight. Built around the rhythm of the city.</p><div class="rule"></div><p class="mono" style="color:var(--ink);margin:16px 0 0;font-weight:600">EGP 2,450&nbsp;&nbsp; →</p></div><div class="scroll-mark">Discover the system</div></div>${watermark}</section>`,

      3: () => `<section class="shot editorial">${nav()}<div class="editorial-grid"><div class="editorial-media"><img src="${A}campaign-duo.png" alt=""/><span class="vertical-label">Transit study · Cairo 2026</span></div><div class="editorial-copy"><span class="eyebrow">Collection 04</span><h1>Clothes for the space between.</h1><p class="lead">A modular uniform for shifting weather. long commutes. and the quiet confidence of moving with purpose.</p><div style="margin-top:28px"><button class="btn">Explore Transit →</button></div><div class="feature-list"><div class="feature-row"><b>01</b><span>Modular layers</span><em>↗</em></div><div class="feature-row"><b>02</b><span>Low-impact textiles</span><em>↗</em></div><div class="feature-row"><b>03</b><span>Unisex fit system</span><em>↗</em></div><div class="feature-row"><b>04</b><span>Made in Egypt</span><em>↗</em></div></div></div></div>${watermark}</section>`,

      4: () => `<section class="shot">${nav()}<div class="shop-body"><div class="shop-head"><div><span class="eyebrow">Shop all</span><h1>Systems for motion</h1></div><small>24 pieces&nbsp;&nbsp; · &nbsp;&nbsp;Sort: Featured ↓</small></div><div class="shop-layout"><aside class="filters"><div class="filter"><span>Category</span><span>+</span></div><div class="filter"><span>Size</span><span>+</span></div><div class="filter"><span>Colour</span><span>+</span></div><div class="filter"><span>Material</span><span>+</span></div><div class="filter"><span>Availability</span><span>+</span></div><p style="margin-top:26px;color:var(--muted);font-size:12px;line-height:1.6">Designed around one flexible wardrobe. Filter by the way you move.</p></aside><div class="products">${productCard('product-overshirt.png','Modular Overshirt 01','Black · 3 colours','2,450','','New')}${productCard('product-hoodie.png','Frame Hoodie 02','Ash · 4 colours','1,950','alt')}${productCard('product-overshirt.png','Transit Layer 03','Stone · 2 colours','2,250','dark','Limited')}${productCard('product-hoodie.png','Form Hoodie 01','Graphite · 3 colours','1,850','','Best seller')}</div></div></div>${watermark}</section>`,

      5: () => `<section class="shot">${nav()}<div class="pdp"><div class="pdp-gallery"><figure><img src="${A}product-overshirt.png" alt=""/></figure><figure><img src="${A}product-overshirt.png" alt=""/></figure></div><section class="pdp-info"><span class="crumb">Shop / Outerwear / System 01</span><div class="pdp-title"><h1>Modular<br>Overshirt 01</h1><b>EGP 2,450</b></div><p class="pdp-desc">A structured everyday layer combining heavyweight cotton twill with matte utility pockets. Cut with room to move and designed to work across seasons.</p><div class="option-label"><span>Colour · Black</span><span>3 options</span></div><div class="swatches"><span class="swatch"></span><span class="swatch grey"></span><span class="swatch" style="background:#d4d0c5;outline:none"></span></div><div class="option-label"><span>Select size</span><span style="text-decoration:underline">Find your fit</span></div><div class="sizes"><div class="size">XS</div><div class="size">S</div><div class="size active">M</div><div class="size">L</div><div class="size">XL</div></div><button class="btn acid" style="margin-top:18px;width:100%">Add to bag · EGP 2,450</button><div class="pdp-note"><span class="lime-dot"></span><span><b>Fit note</b> Ahmed is 184 cm and wears size M for a relaxed fit.</span></div><div class="accordion"><div><span>Details and materials</span><span>+</span></div><div><span>Delivery and returns</span><span>+</span></div></div></section></div>${watermark}</section>`,

      6: () => `<section class="shot"><div class="cart-bg"><img src="${A}campaign-hero.png" alt=""/></div><div class="cart-drawer"><div class="drawer-head"><h1>Your bag · 1</h1><span>×</span></div><div class="shipping-msg">You are <b>EGP 550</b> away from free delivery<div class="progress"><i></i></div></div><div class="cart-item"><div class="cart-thumb"><img src="${A}product-overshirt.png" alt=""/></div><div><span class="cart-price">EGP 2,450</span><h3>Modular Overshirt 01</h3><p>Black · Size M</p><span class="qty">−&nbsp;&nbsp; 1 &nbsp;&nbsp;+</span><p style="margin-top:20px;text-decoration:underline">Remove</p></div></div><div class="cross-sell"><h4>Complete the system</h4><div class="cross-card"><img src="${A}product-hoodie.png" alt=""/><div><b>Frame Hoodie 02</b><br><small>Ash · EGP 1,950</small></div><button class="btn ghost" style="height:38px;padding:0 14px;font-size:9px">Add +</button></div></div><div class="totals"><div class="total-row"><span>Subtotal</span><span>EGP 2,450</span></div><button class="btn acid">Secure checkout →</button><p style="text-align:center;color:var(--muted);font-size:11px">Cash on delivery · Cards · Mobile wallets</p></div></div>${watermark}</section>`,

      7: () => `<section class="shot checkout"><header class="checkout-head"><div class="brand">FORM<b>/</b>01</div><div class="steps"><span class="active">1 Information</span><span>2 Delivery</span><span>3 Payment</span></div><div style="display:flex;gap:10px;align-items:center">${icons.bag}<b class="mono" style="font-size:12px">EGP 2,450</b></div></header><div class="checkout-body"><section class="form-side"><span class="eyebrow">Fast secure checkout</span><h1>Where should we send it?</h1><div class="express"><button>Apple Pay</button><button style="background:#5a31f4">shop Pay</button></div><div class="or">OR CONTINUE WITH DETAILS</div><div class="field-grid"><div class="field full"><label>Email or mobile number</label><span>ahmed@example.com</span></div><div class="field"><label>First name</label><span>Ahmed</span></div><div class="field"><label>Last name</label><span>Hassan</span></div><div class="field full"><label>Street address</label><span>12 El Nozha Street</span></div><div class="field"><label>City</label><span>Cairo</span></div><div class="field"><label>Area</label><span>Nasr City</span></div></div><div class="delivery"><h3>Delivery method</h3><div class="delivery-option"><div><b>Standard delivery</b><small>Arrives in 2–4 business days</small></div><b>EGP 65</b></div></div><button class="btn" style="margin-top:22px;width:100%">Continue to payment →</button></section><aside class="summary-side"><h2>Order summary</h2><div class="summary-product"><figure><img src="${A}product-overshirt.png" alt=""/></figure><div><h3>Modular Overshirt 01</h3><p>Black · M · Qty 1</p></div><b>EGP 2,450</b></div><div class="summary-lines"><div><span>Subtotal</span><b>EGP 2,450</b></div><div><span>Delivery</span><b>EGP 65</b></div><div class="grand"><span>Total</span><span>EGP 2,515</span></div></div><div class="trust"><div><b>Easy returns</b>14-day return window</div><div><b>Secure payment</b>Encrypted checkout</div><div><b>Order support</b>WhatsApp assistance</div><div><b>Nationwide</b>Delivery across Egypt</div></div></aside></div>${watermark}</section>`,

      8: () => `<section class="shot mobile-board"><div class="mobile-copy"><span class="eyebrow" style="color:var(--acid)">Responsive commerce</span><h1>One brand.<br>Two native directions.</h1><p>Purpose-built mobile layouts for English and Arabic. Not a mirrored afterthought. Every action stays clear and reachable.</p><div class="chips"><span class="tag">LTR / RTL</span><span class="tag">Thumb-first</span><span class="tag">Fast checkout</span><span class="tag">Accessible type</span></div></div><div class="phone phone-a"><div class="phone-screen safe"><div class="phone-notch"></div><div class="mobile-nav">${icons.menu}<span class="brand">FORM<b>/</b>01</span>${icons.bag}</div><div class="mobile-hero"><img src="${A}campaign-hero.png" alt=""/><div><span class="eyebrow" style="font-size:9px;color:var(--acid)">Drop 04</span><h3>Everyday motion. Rebuilt.</h3><button class="btn acid">Shop now →</button></div></div><div class="mobile-strip"><h4>New systems</h4><div class="mobile-products"><div><img src="${A}product-overshirt.png" alt=""/></div><div><img src="${A}product-hoodie.png" alt=""/></div></div></div></div></div><div class="phone phone-b"><div class="phone-screen safe rtl"><div class="phone-notch"></div><div class="mobile-nav">${icons.bag}<span class="brand" dir="ltr">FORM<b>/</b>01</span>${icons.menu}</div><div class="mobile-hero"><img src="${A}campaign-duo.png" alt=""/><div><span style="font-size:10px;color:var(--acid)">المجموعة الرابعة</span><h3>أساسيات مصممة للحركة</h3><button class="btn acid" style="font-family:'Segoe UI'">تسوق المجموعة ←</button></div></div><div class="mobile-strip"><h4 style="font-family:'Segoe UI';font-size:13px">وصل حديثًا</h4><div class="mobile-products"><div><img src="${A}product-overshirt.png" alt=""/></div><div><img src="${A}product-hoodie.png" alt=""/></div></div></div></div></div>${watermark}</section>`,

      9: () => `<section class="shot filter-board"><div class="filter-copy"><span class="eyebrow">Mobile discovery UX</span><h1>Find less.<br>Choose better.</h1><p>Fast product scanning and a focused Arabic filter sheet reduce friction without hiding the collection behind complex controls.</p><div class="ux-points"><div class="ux-point"><b>01 · Clear inventory</b><span>Availability and sizes appear before the product page.</span></div><div class="ux-point"><b>02 · Local behaviour</b><span>Arabic-first filtering and familiar price ranges.</span></div><div class="ux-point"><b>03 · One-thumb actions</b><span>Primary controls stay inside comfortable reach.</span></div><div class="ux-point"><b>04 · Saved state</b><span>Filters persist while the customer explores.</span></div></div></div><div class="phone filter-phone-a"><div class="phone-screen"><div class="phone-notch"></div><div class="mobile-shop-head"><div><span class="eyebrow" style="font-size:8px">Shop all</span><h3>Systems</h3></div><span>24 pieces</span></div><div class="mobile-grid"><div class="mobile-card"><img src="${A}product-overshirt.png" alt=""/><b>Overshirt 01</b></div><div class="mobile-card"><img src="${A}product-hoodie.png" alt=""/><b>Hoodie 02</b></div><div class="mobile-card"><img src="${A}product-hoodie.png" alt=""/><b>Frame 03</b></div><div class="mobile-card"><img src="${A}product-overshirt.png" alt=""/><b>Layer 04</b></div></div></div></div><div class="phone filter-phone-b"><div class="phone-screen rtl"><div class="phone-notch"></div><div style="height:100%;background:rgba(10,12,10,.42)"></div><div class="bottom-sheet"><div class="sheet-handle"></div><h3>تصفية المنتجات</h3><div class="sheet-row"><span>القسم</span><b>+</b></div><div class="sheet-row"><span>المقاس</span><b>+</b></div><div class="sheet-row"><span>اللون</span><b>+</b></div><div class="sheet-row"><span>السعر</span><b>+</b></div><div class="sheet-actions"><button class="btn ghost" style="font-family:'Segoe UI'">مسح الكل</button><button class="btn acid" style="font-family:'Segoe UI'">عرض 18 منتج</button></div></div></div></div>${watermark}</section>`,

      10: () => `<section class="shot track">${nav()}<div class="track-body"><aside class="account-nav"><span class="eyebrow" style="color:var(--acid)">My account</span><h2>Welcome back<br>Ahmed.</h2><div class="account-link active"><span>Orders</span><span>02</span></div><div class="account-link"><span>Saved items</span><span>06</span></div><div class="account-link"><span>Addresses</span><span>→</span></div><div class="account-link"><span>Profile</span><span>→</span></div><div class="account-link"><span>Sign out</span><span>↗</span></div></aside><main class="track-main"><div class="track-head"><div><span class="eyebrow">Order FORM-1048</span><h1>Your system is moving.</h1><p>Estimated delivery Thursday 17 September</p></div><span class="status-chip">Out for delivery</span></div><section class="tracking-card"><div class="track-meta"><div><small>Order number</small><b>FORM-1048</b></div><div><small>Courier</small><b>Mylerz</b></div><div><small>Tracking</small><b>MYZ-294103</b></div><div><small>Destination</small><b>Nasr City · Cairo</b></div></div><div class="timeline"><div class="step done"><i>✓</i><b>Confirmed</b><small>14 Sep · 10:42</small></div><div class="step done"><i>✓</i><b>Packed</b><small>15 Sep · 14:18</small></div><div class="step active"><i>3</i><b>Out for delivery</b><small>Today · 09:10</small></div><div class="step"><i>4</i><b>Delivered</b><small>Expected today</small></div></div><div class="order-card"><figure><img src="${A}product-overshirt.png" alt=""/></figure><div><h3>Modular Overshirt 01</h3><p>Black · Size M · Quantity 1</p></div><div style="text-align:right"><b class="mono">EGP 2,450</b><p style="margin-top:8px;text-decoration:underline">View product</p></div></div></section><div style="display:flex;gap:12px;margin-top:22px"><button class="btn ghost">Need help?</button><button class="btn">Download invoice ↓</button></div></main></div><div class="system-band"><span class="lime-dot"></span>Operational UX closes the journey after checkout</div>${watermark}</section>`
    };

    const selected = new URLSearchParams(location.search).get('shot') || '1';
    document.getElementById('root').innerHTML = (shots[selected] || shots[1])();
    Promise.all(Array.from(document.images).map(img => img.complete ? Promise.resolve() : new Promise(resolve => { img.onload = img.onerror = resolve; }))).then(() => { document.documentElement.dataset.ready = 'true'; });
  </script>
</body>
</html>
